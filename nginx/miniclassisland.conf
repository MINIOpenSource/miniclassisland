# ==============================================================================
# MiniClassIsland 聚合仓库 Nginx 配置文件 (根据源码端口与部署架构定制)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. 上游服务定义 (Upstream)
#    从 core/APIDocument.md 中提取的精确端口配置
# ------------------------------------------------------------------------------

# Core 核心服务 - Client API (集控与资源下载)
upstream core_client_api {
    server 127.0.0.1:27041;
}

# Core 核心服务 - Management API (用户与账户管理)
upstream core_management_api {
    server 127.0.0.1:27042;
}

# Core 核心服务 - Admin API (系统与超级管理员管理)
upstream core_admin_api {
    server 127.0.0.1:27043;
}

# Core 核心服务 - gRPC 服务 (Cyrene_MSP 协议)
upstream core_grpc_service {
    server 127.0.0.1:27044;
}

# ------------------------------------------------------------------------------
# 2. 全局 HTTP 重定向
#    强制所有 HTTP 请求 (Port 80) 跳转至安全 HTTPS (Port 443)
# ------------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    
    return 301 https://$host$request_uri;
}

# ------------------------------------------------------------------------------
# 3. 域名重定向与跳转配置
# ------------------------------------------------------------------------------

# 将 dashboard.miniclassisland.com 永久重定向 (301) 到 dash.miniclassisland.com
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dashboard.miniclassisland.com;

    # SSL 证书配置 (读取本地 tls-cert 目录)
    ssl_certificate     D:/.dev/miniclassisland/nginx/tls-cert/miniclassisland.com.crt;
    ssl_certificate_key D:/.dev/miniclassisland/nginx/tls-cert/miniclassisland.com.key;

    # HSTS 安全加固
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    return 301 https://dash.miniclassisland.com$request_uri;
}

# 将主域名 miniclassisland.com 临时重定向 (302) 到 dash.miniclassisland.com
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name miniclassisland.com;

    ssl_certificate     D:/.dev/miniclassisland/nginx/tls-cert/miniclassisland.com.crt;
    ssl_certificate_key D:/.dev/miniclassisland/nginx/tls-cert/miniclassisland.com.key;

    # HSTS 安全加固
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    return 302 https://dash.miniclassisland.com$request_uri;
}

# ------------------------------------------------------------------------------
# 4. Web 前端服务 (dash.miniclassisland.com)
#    采用静态网页部署 (output: "export", 无 trailingSlash)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dash.miniclassisland.com;

    ssl_certificate     D:/.dev/miniclassisland/nginx/tls-cert/miniclassisland.com.crt;
    ssl_certificate_key D:/.dev/miniclassisland/nginx/tls-cert/miniclassisland.com.key;

    # HSTS 安全加固
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # 网页静态导出目录 (Next.js out 目录)
    root D:/.dev/miniclassisland/web/out;

    # 伪静态路由规则 (处理 Next.js 静态文件匹配与 SPA 页面映射)
    location / {
        index index.html;
        try_files $uri $uri.html $uri/ /index.html;
    }

    # 针对静态资源的缓存控制
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}

# ------------------------------------------------------------------------------
# 5. 管理后台前端与 Admin API 服务 (admin.miniclassisland.com)
#    前端采用静态网页部署 (output: "export", 启用 trailingSlash: true)
#    API 接口通过 /api 代理至后端 Admin API 端口
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.miniclassisland.com;

    ssl_certificate     D:/.dev/miniclassisland/nginx/tls-cert/miniclassisland.com.crt;
    ssl_certificate_key D:/.dev/miniclassisland/nginx/tls-cert/miniclassisland.com.key;

    # HSTS 安全加固
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # 网页静态导出目录 (Next.js out 目录)
    root D:/.dev/miniclassisland/admin/out;

    # 后端超级管理员 API 反向代理 (剥离 /api 前缀转发至 :27043)
    location /api {
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass http://core_admin_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 伪静态路由规则 (Next.js 开启 trailingSlash 的映射策略)
    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 针对静态资源的缓存控制
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}

# ------------------------------------------------------------------------------
# 6. Management API 服务 (api.miniclassisland.com)
#    代理至后端管理接口 :27042
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.miniclassisland.com;

    ssl_certificate     D:/.dev/miniclassisland/nginx/tls-cert/miniclassisland.com.crt;
    ssl_certificate_key D:/.dev/miniclassisland/nginx/tls-cert/miniclassisland.com.key;

    # HSTS 安全加固
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    location / {
        proxy_pass http://core_management_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ------------------------------------------------------------------------------
# 7. 通配符子域名服务 (*.miniclassisland.com)
#    区分 gRPC 请求与普通 HTTP 的客户端集控请求
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.miniclassisland.com;

    ssl_certificate     D:/.dev/miniclassisland/nginx/tls-cert/miniclassisland.com.crt;
    ssl_certificate_key D:/.dev/miniclassisland/nginx/tls-cert/miniclassisland.com.key;

    # HSTS 安全加固
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # 默认位置，根据请求头决定路由目标
    location / {
        # 触发 418 内部状态码以跳转到 @grpc 位置 (安全且符合 Nginx 最佳实践)
        error_page 418 = @grpc;
        if ($content_type ~* "^application/grpc") {
            return 418;
        }

        # 默认 HTTP 反向代理 (指向集控 Client API :27041)
        proxy_pass http://core_client_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # gRPC 流量转发 (指向 :27044)
    location @grpc {
        grpc_pass grpc://core_grpc_service;
        
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # 调高超时限制以适应 gRPC 长连接和流传输
        grpc_read_timeout 600s;
        grpc_send_timeout 600s;
    }
}
